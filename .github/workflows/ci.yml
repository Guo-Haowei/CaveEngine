name: CI
run-name: CI/CD Tests triggered by ${{ github.actor }}

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check Formatting
    runs-on: self-hosted
    steps:
      - name: Check Formatting
        uses: actions/checkout@v5
      - run: py ./scripts/format_code.py
      - run: py ./scripts/get_git_changed_files.py

  shader_generation:
    name: Shader Generation
    runs-on: self-hosted
    steps:
      - name: Shader Generation
        uses: actions/checkout@v5
      - run: cd cave/shader/
      - run: py ../../scripts/compile_shaders.py --lang glsl --varying-locations 0,1,2,3

