name: CI
run-name: CI/CD Tests triggered by ${{ github.actor }}

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # format:
  #   name: Check Formatting
  #   runs-on: self-hosted
  #   steps:
  #     - name: Check Formatting
  #       uses: actions/checkout@v5
  #     - run: python3 ./scripts/format_code.py
  #     - run: python3 ./scripts/get_git_changed_files.py

  compile_shaders:
    name: Compile shaders
    runs-on: self-hosted
    steps:
      - name: Compile shaders
        uses: actions/checkout@v5
      - name: Compile GLSL shaders
        run: python3 -m scripts.ci.compile_shaders

  build_debug:
    name: Build Debug
    needs: format
    runs-on: self-hosted
    steps:
      - name: Build Debug
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - run: echo "Building project..."
      - run: python3 ./scripts/generate_meta.py
