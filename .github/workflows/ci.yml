  compile_shaders:
    name: Compile shaders
    runs-on: self-hosted
    steps:
      - name: Compile shaders
        uses: actions/checkout@v5
      - name: Compile GLSL shaders
        run: python3 scripts/compile_shaders.py --source-folder cave/shader/slang --lang glsl --varying-locations 0,1,2,3

